<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./ASSENTS/PAGES/LOGIN/login.css">
    <title>Document</title>
</head>
<body>
    <form class="formulario-login" action="">
        <img class="imagem-login" src="./ASSENTS/IMAGENS/recycle-icon-93a07e 1.png" alt="">
        <h1 class="texto-formulario">Eco Cycle</h1>
        <p class="texto-formulario">Faça login e comece a usar!</p>
        <label class="texto-formulario" for="email">Endereço de Email
            <span id="i-email">
                <img  src="./ASSENTS/IMAGENS/o-email 1.png" alt="">
            </span>
            <input class="input-formulario" placeholder="joãopaulo55@gmail.com" type="email">
        </label>
        <label class="texto-formulario" for="password">Sua senha
            <span id="i-senha">
                <img src="./ASSENTS/IMAGENS/cadeado 1.png" alt="">
            </span>
             <input class="input-formulario" placeholder="*************" type="password">
        </label>
        <label class="checkbox-formulario" for="check">
            <input class="input-formulario"  type="checkbox">
            Lembrar de Mim
        </label> 
        <button class="botao-login"> Entrar na plataforma</button>
        <a class="link-formulario" href="">Esqueceu sua senha ?</a>
        <a class="link-formulario" href="">Não tem conta ? se registre agora!</a>
    </form>
</body>
</html>
