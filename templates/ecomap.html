    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>
        const map = L.map('map').setView([-8.2830, -35.9753], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        function getCorNivel(nivel) {
            if (nivel < 50) return 'green';
            if (nivel < 80) return 'orange';
            return 'red';
        }

        function criarIcone(nivel) {
            return L.divIcon({
                className: '',
                html: `<div style="
                    background:${getCorNivel(nivel)};
                    width:20px; height:20px;
                    border-radius:50% 50% 50% 0;
                    transform:rotate(-45deg);
                    border:2px solid white;
                    box-shadow:0 2px 6px rgba(0,0,0,0.4);
                "></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 20],
                popupAnchor: [0, -22]
            });
        }

        const token = localStorage.getItem('access_token');

        fetch('/pontos_coleta', {
            headers: {
                'Authorization': 'Bearer ' + token
            }
        })
        .then(res => res.json())
        .then(data => {
            const pontos = data.pontos || [];
            pontos.forEach(p => {
                const nivel = p.nivel_preenchimento || 0;
                const marker = L.marker([p.latitude, p.logintude], {
                    icon: criarIcone(nivel)
                }).addTo(map);

                marker.bindPopup(`
                    <b>♻️ ${p.nome}</b><br>
                    📍 ${p.endereco}<br>
                    🕐 ${p.horario_funcionamento || 'Não informado'}<br>
                    📊 Nível: <b style="color:${getCorNivel(nivel)}">${nivel}%</b><br>
                    ${p.descricao ? '<i>' + p.descricao + '</i>' : ''}
                `);
            });
        })
        .catch(err => {
            console.error('Erro ao carregar pontos:', err);
        });
    </script>
