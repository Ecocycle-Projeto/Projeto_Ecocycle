<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil</title>
    <link rel="stylesheet" href="../static/pages/perfil_usuario/perfil_usuario.css">
    <link rel="website icon" href="../static/imagens/icons8-reciclagem-50 1.png">
</head>
<body>
    <header class="header-ecomap">
        <img class="img-header-ecomap" src="../static/imagens/Banner_EcoCycle-removebg-preview 1.png" alt="">
    </header>
    <menu class="menu-ecomap">
        <ul>
            <li><a class="home" href="http://127.0.0.1:5000/">HOME</a></li>
            <li><a href="#">SERVIÇOS</a></li>
            <li><a href="#">CLIENTES</a></li>
            <li><a href="#">PROJETOS</a></li>
            <li><a href="#">CONTATO</a></li>
        </ul>
    </menu>
    <main class="caixa-pai">
        <div class="foto-usuario">
            <img src="../static/imagens/icons8-usuário-100.png" alt="">
        </div>
        <div class="editar">
            <p>EDITAR</p>
        </div>
        <div class="formulario-usuario">
            <form class="formulario" action="">
                <label for="nome"> NOME
                <input id="nome" type="text">
                </label>
                <label for="email"> EMAIL
                <input id="email" type="text">
                </label>
            </form>
        </div>
        <div class="botoes-formulario">
            <button id="alterar" class="botao">Alterar senha</button>
            <button id="verificacao" class="botao">Ativar verificação por duas etapas</button>  
        </div>
    </main>
    <div class="excluir">
        <a href="">Excluir conta</a>
    </div>
    
</body>
</html>
