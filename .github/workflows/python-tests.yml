name: Testes de API Python

# Quando este fluxo de trabalho será executado
on:
  push:
    branches:
      - API
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Instalar dependências
        run: pip install pytest

      - name: Rodar testes
        run: pytest
