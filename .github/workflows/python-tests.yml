name: Testes de API Python

# Quando este fluxo de trabalho será executado
on:
  push:
    branches:
      - API
  pull_request:
    branches:
      - main

jobs:
  test_suite:
    # Rodar no ambiente Ubuntu mais recente
    runs-on: ubuntu-latest

    # Configura o serviço de banco de dados
    services:
      postgres:
        image: postgres:14.4
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Testar em múltiplas versões do Python
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11"]

    steps:
      # Baixa o código do seu repositório
      - name: Checkout código
        uses: actions/checkout@v4

      # Configura o Python
      - name: Configurar Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      # Instala as dependências, incluindo o pytest
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install psycopg2-binary # Adicionado para garantir a instalação do driver
      
      # Espera o banco de dados estar pronto (opcional, mas recomendado)
      - name: Esperar o banco de dados estar disponível
        run: |
          # Espera até que o serviço de banco de dados esteja pronto
          python -c 'import sys, socket; s = socket.socket(); s.connect(("localhost", 5432)); sys.exit(0)'
        
      # Configura as variáveis de ambiente de conexão com o banco de dados
      - name: Configurar variáveis de ambiente do banco de dados
        run: |
          echo "DATABASE_URL=postgresql://user:password@localhost:5432/testdb" >> $GITHUB_ENV
        
      # Roda os testes
      - name: Executar testes com Pytest
        run: |
          pytest