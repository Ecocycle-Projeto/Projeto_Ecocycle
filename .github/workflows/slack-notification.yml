name: Notificação Slack

on:
  push:
    branches:
      - API 
      - main 

jobs:
  build_and_notify:

    runs-on: ubuntu-latest
    
    steps:
      
      - name: Checkout do código
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
     
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-flask
          pip install python-dotenv
      
      
      - name: Executar testes
        id: run_tests
        run: pytest
        
      - name: Notificar Sucesso no Slack
        if: success()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ✅ *SUCESSO:* A build da branch `${{ github.ref_name }}` foi concluída com sucesso!
            Autor: ${{ github.actor }}
            Mensagem: `${{ github.event.head_commit.message }}`
            URL da Ação: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL: 'geral' 
          SLACK_COLOR: 'good'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_TITLE: 'Projeto EcoCycle'
      
      - name: Notificar Falha no Slack
        if: failure()
        uses: rtCamp/action-slack-notify@v2
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_MESSAGE: |
            ❌ *FALHA:* A build da branch `${{ github.ref_name }}` falhou.
            Autor: ${{ github.actor }}
            Mensagem: `${{ github.event.head_commit.message }}`
            URL da Ação: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SLACK_CHANNEL: 'geral' 
          SLACK_COLOR: 'danger'
          SLACK_USERNAME: 'GitHub Actions'
          SLACK_TITLE: 'Projeto EcoCycle'
